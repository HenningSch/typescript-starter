<header class="music-header">
  <div class="left-content">
    <h2 [class.hide]="currentPage === 'music'">Music Library</h2>

    <button (click)="server.navigateURL('home')"  class="home-btn" [class.show]="currentPage === 'music'">
      <i class="pi pi-home"></i>
    </button>
  </div>

  <div (click)="toggleCurrentPage()" class="avatar">
    <img src="{{avatarUrl}}" alt="User Avatar" />
  </div>
</header>
